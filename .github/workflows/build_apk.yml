name: KharchaAI Android APK Build & Release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --dart-define=ENV=production \
            --dart-define=API_URL=https://kharcha-ai-backend.onrender.com
          cp build/app/outputs/flutter-apk/app-release.apk KharchaAI.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KharchaAI-Release-APK
          path: KharchaAI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KharchaAI Android Release v1.0.0"
          body: "Direct download link for KharchaAI Android mobile application APK."
          files: KharchaAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
